name: Build daily briefing

on:
  schedule:
    # Asia/Manila is UTC+8, so local times are 8 hours behind in UTC.
    # Deliberately NOT on the hour: GitHub queues scheduled runs at minute 0 behind
    # everyone else's, and this repo's on-the-hour runs were starting 2.5 to 9 hours
    # late. 05:23 PHT is also after the US close in both summer and winter time.
    - cron: '23 21 * * *'  # 05:23 PHT (21:23 UTC previous day) - morning edition
    - cron: '23 9 * * *'   # 17:23 PHT (09:23 UTC same day)     - evening edition
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # only used for the heartbeat commit below

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests cryptography icalendar recurring-ical-events google-auth

      # Fails fast, with a readable message, if the wrong file was uploaded as the builder.
      - name: Check the builder is valid Python
        run: |
          python -m py_compile build_briefing.py || {
            echo "::error file=build_briefing.py::build_briefing.py is not valid Python. Was another file (for example index.html) pasted over it?"
            exit 1
          }

      # Prints only whether each secret is visible, never its value - safe for public logs.
      - name: Check secrets are visible
        env:
          BRIEF_PASSCODE:   ${{ secrets.BRIEF_PASSCODE }}
          GIST_ID:          ${{ secrets.GIST_ID }}
          GIST_TOKEN:       ${{ secrets.GIST_TOKEN }}
          CALENDAR_ID:      ${{ secrets.CALENDAR_ID }}
          GOOGLE_SA_JSON:   ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID:         ${{ secrets.SHEET_ID }}
        run: |
          echo "Required:"
          for v in BRIEF_PASSCODE GIST_ID GIST_TOKEN; do
            if [ -n "${!v}" ]; then echo "  $v: set"; else echo "  $v: MISSING"; fi
          done
          echo "Optional (calendar + portfolio tiles):"
          for v in CALENDAR_ID GOOGLE_SA_JSON SHEET_ID; do
            if [ -n "${!v}" ]; then echo "  $v: set"; else echo "  $v: not set"; fi
          done

      - name: Build, encrypt and push payload
        env:
          BRIEF_PASSCODE:   ${{ secrets.BRIEF_PASSCODE }}
          GIST_ID:          ${{ secrets.GIST_ID }}
          GIST_TOKEN:       ${{ secrets.GIST_TOKEN }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          GOOGLE_SA_JSON:   ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_RANGE:      ${{ secrets.SHEET_RANGE }}
          CALENDAR_ID:      ${{ secrets.CALENDAR_ID }}
        run: python build_briefing.py

      # GitHub disables scheduled workflows after 60 days with no repo activity.
      # This commit keeps the repo active so the cron never silently stops.
      - name: Heartbeat
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt state.json
          git diff --staged --quiet || git commit -m "heartbeat: $(date -u +%F)"
          git push
